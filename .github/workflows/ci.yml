# Continuous integration for RunFix.
#
# NOTE: this workflow was authored together with 1.0.0 but has not been executed on GitHub yet
# (the development machine has no runner of its own). The first push will show whether it needs
# adjustment; treat a red check as a workflow problem until proven otherwise.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,mcp]"
      - name: Version
        run: python -m runfix --version
      - name: Unit and integration tests
        run: python -m pytest -q
      - name: MCP stdio handshake and permission gates
        run: python -m runfix.mcp.smoke
      - name: Diagnosis benchmark
        run: python -m runfix bench

  full-mcp:
    name: MCP all tools (ubuntu, py3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,mcp]"
      - name: Exercise all 23 tools over the protocol
        run: python -m runfix.mcp.smoke --full

  package:
    name: build and install the wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
      - name: Install in a clean virtual environment
        run: |
          python -m venv /tmp/verify
          /tmp/verify/bin/python -m pip install --upgrade pip
          /tmp/verify/bin/python -m pip install dist/*.whl
          /tmp/verify/bin/python -m runfix --version
          /tmp/verify/bin/python -c "import runfix, runfix.audit, runfix.checkpoint, runfix.approvals, runfix.bench, runfix.diagnosis, runfix.repro; print('imports ok')"
